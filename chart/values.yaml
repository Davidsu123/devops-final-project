replicaCount: 1

image:
  repository: david147852/final-project-app
  # Empty means: use appVersion from Chart.yaml as the image tag
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000

# MongoDB runs separately, in the default namespace (see infra/mongodb)
mongodb:
  host: mongodb.default.svc.cluster.local
  user: root
  # The password is NOT here. It is in a Kubernetes Secret created by hand.
  secretName: mongodb-secret

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Lets Prometheus collect the app metrics.
# Needs kube-prometheus-stack installed first (see infra/monitoring).
serviceMonitor:
  enabled: true
