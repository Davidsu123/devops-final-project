apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "final-project.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "final-project.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "final-project.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: MONGO_HOST
              value: {{ .Values.mongodb.host | quote }}
            - name: MONGO_USER
              value: {{ .Values.mongodb.user | quote }}
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.secretName }}
                  key: MONGO_PASSWORD
          # Liveness: if the app stops answering, Kubernetes restarts it
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          # Readiness: send visitors only when the database is reachable
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
