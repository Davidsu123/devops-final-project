{{- if .Values.serviceMonitor.enabled }}
# Tells Prometheus to collect the app metrics from /metrics every 15 seconds
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "final-project.labels" . | nindent 4 }}
    release: prometheus  # Prometheus looks for this label
spec:
  selector:
    matchLabels:
      {{- include "final-project.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
